# 第一个文档：只放 import，不要在这里写配置
# （import 的内容会插入在本文档之后，同一文档里的同 key 配置会被 application-lib.yml 覆盖）
spring:
  config:
    import: classpath:application-lib.yml

# ---------------------------------------------------------------------------
# 第二个文档：业务项目自己的配置，优先级高于 application-lib.yml
# ---------------------------------------------------------------------------
---
# H2 数据库文件根路径（不含扩展名）。
# 默认写入容器内 /data 目录（docker-compose 已把 ./data 挂载到 /data，数据持久化）。
# 本地开发可通过 -Ddb_path=./data/db/open-admin-example 覆盖。
# 切换到 MySQL：见 application-mysql.yml（--spring.profiles.active=mysql）。
db_path: /data/db/open-admin-example

server:
  servlet:
    context-path: /example  # 业务项目按需修改；容器部署由 prod profile 覆盖为 /

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    # 内置 H2（MySQL 兼容模式），首次启动自动建表并写入种子数据，无需外部数据库
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:file:${db_path};MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

sys:
  title: 示例系统
