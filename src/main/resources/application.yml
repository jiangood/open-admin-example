# 第一个文档：只放 import，不要在这里写配置
# （import 的内容会插入在本文档之后，同一文档里的同 key 配置会被 application-lib.yml 覆盖）
spring:
  config:
    import: classpath:application-lib.yml

# ---------------------------------------------------------------------------
# 第二个文档：业务项目自己的配置，优先级高于 application-lib.yml
# ---------------------------------------------------------------------------
---
sys:
  title: 示例系统
  data-dir: /data/example
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:file:${sys.data-dir}/db_h2/database;MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect


